server:
  port: 8080

spring:
  application:
    name: mm-erp
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    postgresql:
      transactional-lock: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Tashkent
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mm}
    password: ${RABBITMQ_PASSWORD:}
  mail:
    host: ${RFQ_SMTP_HOST:smtp.gmail.com}
    port: ${RFQ_SMTP_PORT:587}
    username: ${RFQ_SMTP_USERNAME}
    password: ${RFQ_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${RFQ_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${RFQ_SMTP_STARTTLS:true}

mm:
  one-c-api:
    username: ${MM_ONE_C_API_USERNAME}
    password: ${MM_ONE_C_API_PASSWORD}
    tenant: ${MM_ONE_C_API_TENANT:default}
    company: ${MM_ONE_C_API_COMPANY:753e618e-8d47-4efd-a41e-df8311b83d2f}
    pull-enabled: ${MM_ONE_C_API_PULL_ENABLED:true}

  rfq-mail:
    enabled: ${RFQ_MAIL_ENABLED:true}
    from: ${RFQ_MAIL_FROM}
    reply-to: ${RFQ_MAIL_REPLY_TO}
    portal-base-url: ${SUPPLIER_PORTAL_BASE_URL}
    magic-link-pepper: ${RFQ_MAGIC_LINK_PEPPER}
    callback-secret: ${RFQ_MAIL_CALLBACK_SECRET}
    max-automatic-retries: ${RFQ_MAIL_MAX_AUTOMATIC_RETRIES:5}
    batch-size: ${RFQ_MAIL_BATCH_SIZE:20}
    poll-delay-ms: ${RFQ_MAIL_POLL_DELAY_MS:30000}

  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_API_KEY}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
    analysis-timeout: ${AI_ANALYSIS_TIMEOUT:180s}
    inventory-document-extraction:
      timeout: ${AI_INVENTORY_EXTRACTION_TIMEOUT:350s}
      job-timeout: ${AI_INVENTORY_EXTRACTION_JOB_TIMEOUT:30m}
    receipt-advice:
      base-url: ${AI_RECEIPT_ADVICE_BASE_URL:${mm.ai.base-url}}
      api-key: ${AI_RECEIPT_ADVICE_API_KEY:${mm.ai.api-key:}}
      enabled: ${AI_RECEIPT_ADVICE_ENABLED:true}
      timeout: ${AI_RECEIPT_ADVICE_TIMEOUT:120s}
      max-request-bytes: ${AI_RECEIPT_ADVICE_MAX_REQUEST_BYTES:2097152}

app:
  time-zone: Asia/Tashkent
  kimyosanoat:
    webhook:
      auto-post-enabled: true
      username: ${KIMYOSANOAT_WEBHOOK_USERNAME}
      password: ${KIMYOSANOAT_WEBHOOK_PASSWORD}
      tenant-id: default
      company-id: ${KIMYOSANOAT_WEBHOOK_COMPANY_ID}
  seed:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
  inventory:
    allow-negative-stock: ${ALLOW_NEGATIVE_STOCK:false}
  firebase:
    enabled: true
    project-id: materials-management-82c3c
    service-account-file: classpath:firebase-service-account.json
    service-account-json: ''
    service-account-base64: ''
  identity:
    sso:
      enabled: ${SSO_ENABLED:false}
      provider-type: ${SSO_PROVIDER_TYPE:OIDC}
      login-url: ${SSO_LOGIN_URL:}
      assertion-secret: ${SSO_ASSERTION_SECRET:}
      state-secret: ${SSO_STATE_SECRET:${JWT_SECRET}}
      authorization-url: ${SSO_AUTHORIZATION_URL:}
      token-url: ${SSO_TOKEN_URL:}
      user-info-url: ${SSO_USER_INFO_URL:}
      client-id: ${SSO_CLIENT_ID:}
      client-secret: ${SSO_CLIENT_SECRET:}
      redirect-uri: ${SSO_REDIRECT_URI:http://localhost:5173/sso/callback}
      client-auth-method: ${SSO_CLIENT_AUTH_METHOD:BASIC}
      scopes: ${SSO_SCOPES:openid,profile,email}
      trusts-idp-mfa: ${SSO_TRUSTS_IDP_MFA:true}
      timestamp-skew-seconds: ${SSO_TIMESTAMP_SKEW_SECONDS:300}
      metadata-url: ${SSO_METADATA_URL:}
      idp-entity-id: ${SSO_IDP_ENTITY_ID:}
      sp-entity-id: ${SSO_SP_ENTITY_ID:}
      acs-url: ${SSO_ACS_URL:}
      x509-certificate: ${SSO_X509_CERTIFICATE:}
      saml-private-key: ${SSO_SAML_PRIVATE_KEY:}
    sms-mfa:
      enabled: ${SMS_MFA_ENABLED:false}
      code-pepper: ${SMS_MFA_CODE_PEPPER:${JWT_SECRET}}
      ttl-seconds: ${SMS_MFA_TTL_SECONDS:300}
      include-code-in-outbox: ${SMS_MFA_INCLUDE_CODE_IN_OUTBOX:false}
      gateway:
        enabled: ${SMS_GATEWAY_ENABLED:false}
        provider-code: ${SMS_GATEWAY_PROVIDER:CUSTOM}
        url: ${SMS_GATEWAY_URL:}
        auth-url: ${SMS_GATEWAY_AUTH_URL:}
        method: ${SMS_GATEWAY_METHOD:POST}
        auth-header: ${SMS_GATEWAY_AUTH_HEADER:Authorization}
        auth-token: ${SMS_GATEWAY_AUTH_TOKEN:}
        login: ${SMS_GATEWAY_LOGIN:}
        password: ${SMS_GATEWAY_PASSWORD:}
        account-sid: ${SMS_GATEWAY_ACCOUNT_SID:}
        service-sid: ${SMS_GATEWAY_SERVICE_SID:}
        from-phone: ${SMS_GATEWAY_FROM_PHONE:}
        sender: ${SMS_GATEWAY_SENDER:ERP-MM}
        template: '${SMS_GATEWAY_TEMPLATE:ERP MM verification code: {code}. Valid for {ttlSeconds} seconds.}'
        timeout-seconds: ${SMS_GATEWAY_TIMEOUT_SECONDS:8}
  attachments:
    storage-provider: ${ATTACHMENT_STORAGE_PROVIDER:LOCAL}
    storage-root: ${ATTACHMENT_STORAGE_ROOT:./data/attachments}
    s3-endpoint: ${ATTACHMENT_S3_ENDPOINT:}
    s3-region: ${ATTACHMENT_S3_REGION:us-east-1}
    s3-bucket: ${ATTACHMENT_S3_BUCKET:mm-attachments}
    s3-access-key: ${ATTACHMENT_S3_ACCESS_KEY:}
    s3-secret-key: ${ATTACHMENT_S3_SECRET_KEY:}
    s3-path-style: ${ATTACHMENT_S3_PATH_STYLE:true}
    s3-request-timeout-seconds: ${ATTACHMENT_S3_REQUEST_TIMEOUT_SECONDS:30}
    max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:20971520}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain
      - application/json
  integrations:
    webhook-url: ${INTEGRATION_WEBHOOK_URL:}
    settings-secret: ${INTEGRATION_SETTINGS_SECRET:${JWT_SECRET}}
    message-queue:
      enabled: ${INTEGRATION_MQ_ENABLED:false}
      exchange: ${INTEGRATION_MQ_EXCHANGE:mm.integration.events}
      routing-key: ${INTEGRATION_MQ_ROUTING_KEY:mm.integration.event}
    systems:
      fi:
        enabled: true
        mock-mode: ${FI_MOCK_MODE:false}
        base-url: ${FI_BASE_URL:http://localhost:8082}
        auth-type: ${FI_AUTH_TYPE:BASIC}
        username: ${FI_USERNAME:${UZASSETS_INTEGRATION_USERNAME:}}
        password: ${FI_PASSWORD:${UZASSETS_INTEGRATION_PASSWORD:}}
        bearer-token: ${FI_BEARER_TOKEN:}
        api-key-header: ${FI_API_KEY_HEADER:Authorization}
        api-key: ${FI_API_KEY:}
        client-id: ${FI_CLIENT_ID:}
        client-secret: ${FI_CLIENT_SECRET:}
        auth-path: ${FI_AUTH_PATH:}
        events-path: ${FI_EVENTS_PATH:/api/v1/basic/finmodel/integrations/entries}
        health-path: ${FI_HEALTH_PATH:/api/v1/health/status}
      treasury:
