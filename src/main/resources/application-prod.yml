    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        deployment:
          include: readinessState,db,diskSpace
          show-details: never
          show-components: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.enterprise.mm: INFO
